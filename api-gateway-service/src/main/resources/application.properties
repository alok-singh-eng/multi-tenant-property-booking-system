spring.application.name=api-gateway-service
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,gateway,info
management.endpoint.gateway.access=read-only
management.endpoints.access.max-permitted=unrestricted
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.server.webflux.routes[1].id=hotel-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://hotel-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/hotels/**

spring.cloud.gateway.server.webflux.routes[2].id=search-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://search-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/search/**

spring.cloud.gateway.server.webflux.routes[3].id=inventory-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/inventory/**

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/payments/**

spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.server.webflux.routes[6].id=booking-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://booking-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/bookings/**
